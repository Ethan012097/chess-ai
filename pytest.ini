[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -p no:faulthandler
# 關掉 faulthandler：Windows 上 PyTorch 的 CPU conv 會觸發一個由 oneDNN 自己處理掉的
# first-chance access violation，faulthandler 會把它印成嚇人的 traceback，但測試其實
# 是通過的（在 pytest 外面直接跑 python -m src.model 完全正常）。
